# Multi-device: platform=auto | android | ios
# Maven mặc định chạy testng-multidevice.xml → không cần sửa; từng <test> gắn suitePlatform.
platform=auto

# Đường chính: BaseDriver probe (suite param → -DappiumServer → giá trị này → PM2 fallback 4723/4725).
# Giá trị bên dưới là 1 trong các candidate, không phải nguồn duy nhất — đổi không bắt buộc.
appiumServer=http://127.0.0.1:4723

# ----------------------------------------------------------------
# Song song nhiều session: hệ thống sẽ ưu tiên port explicit từ Jenkins (-D...),
# nếu không có thì fallback theo base + offset theo UDID trong DriverFactory.
# Đổi base nếu trùng cổng với app khác trên máy.
# ----------------------------------------------------------------
android.systemPort.base=8300
ios.wdaLocalPort.base=8100
ios.mjpegServerPort.base=10100
ios.derivedDataPath=

# ----------------------------------------------------------------
# Môi trường app: prod (default) | dev
# ConfigManager.resolveByEnv() đọc `<base>.<env>` trước, fallback `<base>` cho
# legacy. Override khi chạy: `mvn test -Dapp.env=dev` hoặc Jenkins parameter
# APP_ENV → script truyền -Dapp.env=$APP_ENV.
# ----------------------------------------------------------------
app.env=prod

# ----------------------------------------------------------------
# Android — chỉ máy thật (loại emulator-*) trừ khi đặt false
# ----------------------------------------------------------------
android.realDeviceOnly=true
android.udid=
android.deviceName=
# Legacy (fallback nếu .prod/.dev không có) — giữ để backward compat.
android.appPackage=com.yokara.v3
android.appActivity=com.yokara.v3.MainActivity
# Bundle/activity theo môi trường:
android.appPackage.prod=com.yokara.v3
android.appPackage.dev=com.yokara.dev.v1
android.appActivity.prod=com.yokara.v3.MainActivity
# Activity dev: đoán theo pattern <package>.MainActivity — sửa nếu app dev dùng activity khác.
android.appActivity.dev=com.yokara.dev.v1.MainActivity

# ----------------------------------------------------------------
# iOS — chỉ USB thật, không Simulator
# ----------------------------------------------------------------
ios.target=device
ios.trySimulatorFirst=false
ios.simulatorDeviceName=iPhone 14
ios.udid=
ios.deviceName=
ios.platformVersion=
ios.noReset=true
ios.forceAppLaunch=false
ios.showXcodeLog=true
ios.logXcodeEnvironment=true
ios.xcodeOrgId=
ios.xcodeSigningId=iPhone Developer
ios.wda.bundleId=com.yokara.WebDriverAgentRunner
ios.app=
# Legacy (fallback) — giữ cho backward compat khi không truyền app.env.
ios.bundleId=com.yokara
# Bundle theo môi trường:
ios.bundleId.prod=com.yokara
ios.bundleId.dev=com.dev.yokara
